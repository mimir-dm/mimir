[package]
name = "mimir-mcp"
version = "0.7.3"
edition = "2021"
description = "The MCP tools of Mimir campaign management (served at the server's /mcp)"

[dependencies]
# Internal crates
mimir-core = { path = "../mimir-core" }
mimir-mapgen = { path = "../mimir-mapgen" }

# Error handling
thiserror = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

# Database
diesel = { workspace = true }

# Utilities
uuid = { workspace = true }

[dev-dependencies]
# SRD catalog fixture for catalog search tests.
mimir-core = { path = "../mimir-core", features = ["fixtures"] }
tokio = { workspace = true }
tempfile = { workspace = true }
diesel_migrations = { workspace = true }
