[package]
name = "mimir"
version = "0.7.3"
edition = "2021"
description = "Mimir D&D Campaign Manager - Desktop Application"
authors = ["Dylan Storey"]
license = "MIT"
default-run = "mimir"

[lib]
name = "mimir_lib"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "mimir"
path = "src/main.rs"

# Dev-only invoke-over-HTTP bridge for the Playwright UI harness.
# Never built by default; requires --features ui-harness.
[[bin]]
name = "ui-bridge"
path = "src/bin/ui_bridge.rs"
required-features = ["ui-harness"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"

# Core library
mimir-core = { path = "../mimir-core" }
mimir-print = { path = "../mimir-print" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
diesel = { version = "2.2", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
thiserror = "2"

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
tar = "0.4"
flate2 = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# UI harness bridge (dev-only, behind the ui-harness feature)
axum = { version = "0.8", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Dev-only Playwright/UX harness: HTTP bridge into the real invoke pipeline.
# OFF by default and excluded from release builds (only the ui-bridge bin uses it).
ui-harness = ["tauri/test", "dep:axum", "dep:tower-http"]
