name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-mapgen:
    name: Build mimir-mapgen
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Build mimir-mapgen binary
        run: cargo build --release --package mimir-mapgen --target ${{ matrix.target }}

      - name: Name the binary for its target (unix)
        if: matrix.platform != 'windows-latest'
        run: cp target/${{ matrix.target }}/release/mimir-mapgen mimir-mapgen-${{ matrix.target }}

      - name: Name the binary for its target (windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: Copy-Item target/${{ matrix.target }}/release/mimir-mapgen.exe mimir-mapgen-${{ matrix.target }}.exe

      - name: Upload mimir-mapgen binary
        uses: actions/upload-artifact@v4
        with:
          name: mimir-mapgen-${{ matrix.target }}
          path: mimir-mapgen-${{ matrix.target }}*

  release:
    name: Draft the release
    needs: build-mapgen
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the mimir-mapgen binaries
        uses: actions/download-artifact@v4
        with:
          pattern: mimir-mapgen-*
          path: mapgen-binaries
          merge-multiple: true

      - name: Create the draft release with the binaries
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" mapgen-binaries/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Mimir $GITHUB_REF_NAME" \
            --notes "See the assets to download this version." \
            --draft
