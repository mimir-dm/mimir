name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-gui-build:
    name: Test GUI Build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            args: ""
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        working-directory: ./crates/mimir/frontend
        run: npm ci

      - name: Build mimir-mcp sidecar (unix)
        if: matrix.platform != 'windows-latest'
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
        run: bash scripts/build-sidecar.sh

      - name: Build mimir-mcp sidecar (windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
        run: .\scripts\build-sidecar.ps1

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./crates/mimir
          args: ${{ matrix.args }}

  lint:
    name: Format and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned so a new stable release cannot add lints and fail CI without
      # notice. To bump: update the version here, run
      # `cargo clippy --workspace --all-targets -- -D warnings` with it, and
      # fix or allow what it reports in the same PR.
      - name: install Rust 1.93.0 (rustfmt, clippy)
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install dependencies (ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # The app crate's Tauri build needs the built frontend and the sidecar.
      - name: build frontend
        working-directory: ./crates/mimir/frontend
        run: |
          npm ci
          npm run build

      - name: Build mimir-mcp sidecar
        env:
          TAURI_ENV_TARGET_TRIPLE: x86_64-unknown-linux-gnu
        run: bash scripts/build-sidecar.sh

      - name: cargo clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install frontend dependencies
        working-directory: ./crates/mimir/frontend
        run: npm ci

      - name: run tests
        working-directory: ./crates/mimir/frontend
        run: npx vitest run

  test-other-crates:
    name: Test Other Crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install angreal
        run: pip install 'angreal>=2'

      - name: Run core tests
        run: angreal test unit --core

  test-web:
    name: Web Server, Wire Types and Web App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Test mimir-wire, mimir-server and mimir-web
        run: cargo test -p mimir-wire -p mimir-server -p mimir-web

      # The web app compiles against mimir-wire, so it must build for wasm.
      - name: Build mimir-wire for wasm32
        run: cargo build -p mimir-wire --target wasm32-unknown-unknown

      - name: Install trunk
        run: |
          curl -sSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.cargo/bin"
          trunk --version

      - name: Build the web app bundle (trunk)
        working-directory: crates/mimir-web
        run: trunk build --release

      # Smoke suite: Playwright starts mimir-server (web-e2e/session.sh) on a
      # scratch data dir with the fixture and the bundle built above.
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install the e2e harness
        working-directory: crates/mimir-web/web-e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Web smoke suite (Playwright)
        working-directory: crates/mimir-web/web-e2e
        run: npx playwright test specs/smoke.spec.ts specs/map.spec.ts specs/display.spec.ts specs/combat.spec.ts specs/players.spec.ts

      - name: Upload Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-results
          path: crates/mimir-web/web-e2e/results
          if-no-files-found: ignore

  test-integration:
    name: Integration Tests (Heavy)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        working-directory: ./crates/mimir/frontend
        run: npm ci

      - name: Run Rust integration tests (SRD-seeded DB)
        run: cargo test -p mimir-core --test srd_smoke_test -- --test-threads=1

      - name: Run frontend tests
        working-directory: ./crates/mimir/frontend
        run: npx vitest run

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Run Rust coverage
        run: |
          cargo tarpaulin -p mimir-core \
            --out Html --out Xml \
            --output-dir target/coverage \
            --ignore-tests \
            --no-fail-fast \
            -- --test-threads=1
        continue-on-error: true

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            target/coverage/tarpaulin-report.html
            target/coverage/cobertura.xml
          retention-days: 30
