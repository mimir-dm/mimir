name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned so a new stable release cannot add lints and fail CI without
      # notice. To bump: update the version here, run
      # `cargo clippy --workspace --all-targets -- -D warnings` with it, and
      # fix or allow what it reports in the same PR.
      - name: install Rust 1.93.0 (rustfmt, clippy, wasm32)
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo clippy, the web app for wasm32 (warnings are errors)
        run: cargo clippy -p mimir-web --target wasm32-unknown-unknown -- -D warnings

  test-rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install angreal
        run: pip install 'angreal>=2'

      - name: Run the Rust tests
        run: angreal test unit

  test-web:
    name: Web App (build and e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # The web app compiles against mimir-wire, so it must build for wasm.
      - name: Build mimir-wire for wasm32
        run: cargo build -p mimir-wire --target wasm32-unknown-unknown

      - name: Install trunk
        run: |
          curl -sSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.cargo/bin"
          trunk --version

      # Node: the Trunk hook builds the editor bundle (editor/build.sh,
      # MIMIR-T-0719), and the e2e harness below.
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Build the web app bundle (trunk)
        working-directory: crates/mimir-web
        run: trunk build --release

      # Smoke suite: Playwright starts mimir-server (web-e2e/session.sh) on a
      # scratch data dir with the fixture and the bundle built above.
      - name: Install the e2e harness
        working-directory: crates/mimir-web/web-e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Web smoke suite (Playwright)
        working-directory: crates/mimir-web/web-e2e
        run: npx playwright test specs/smoke.spec.ts specs/map.spec.ts specs/display.spec.ts specs/combat.spec.ts specs/players.spec.ts specs/characters.spec.ts specs/party.spec.ts specs/editor.spec.ts specs/authoring.spec.ts specs/characters-dm.spec.ts specs/reference.spec.ts specs/homebrew.spec.ts specs/settings.spec.ts

      - name: Upload Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-results
          path: crates/mimir-web/web-e2e/results
          if-no-files-found: ignore

  test-integration:
    name: Integration Tests (Heavy)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust integration tests (SRD-seeded DB)
        run: cargo test -p mimir-core --test srd_smoke_test -- --test-threads=1

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Run Rust coverage
        run: |
          cargo tarpaulin -p mimir-core \
            --out Html --out Xml \
            --output-dir target/coverage \
            --ignore-tests \
            --no-fail-fast \
            -- --test-threads=1
        continue-on-error: true

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            target/coverage/tarpaulin-report.html
            target/coverage/cobertura.xml
          retention-days: 30
