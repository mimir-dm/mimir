[workspace]
members = [
    "crates/mimir-core",
    "crates/mimir-mapgen",
    "crates/mimir-mcp",
    "crates/mimir-print",
    "crates/mimir-render",
    "crates/mimir-server",
    "crates/mimir-web",
    "crates/mimir-wire",
]
resolver = "2"

[workspace.dependencies]
# Core dependencies
tokio = { version = "1.37", features = ["full"] }
tokio-util = "0.7"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
regex = "1.10"
libsqlite3-sys = { version = "0.28", features = ["bundled"] }
diesel = { version = "2.1", features = ["sqlite", "chrono", "uuid", "64-column-tables", "returning_clauses_for_sqlite_3_35", "r2d2"] }
diesel_migrations = "2.1"

# HTTP client for Ollama
futures = "0.3"
serde_yaml = "0.9"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Template engine

# Frontmatter parsing
gray_matter = "0.3"

# Markdown parsing
pulldown-cmark = "0.12"

# Cryptography
sha2 = "0.10"

# CLI
clap = { version = "4.0", features = ["derive"] }

# File handling
walkdir = "2.5"
base64 = "0.22.1"

# Image processing
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# Parallel processing

# Macros

# Typst (PDF generation)
typst = "0.12"
typst-pdf = "0.12"
ecow = "0.2"
fontdb = "0.21"
imageproc = "0.25"

# Noise generation
noise = "0.9"
rand = "0.8"
rand_chacha = "0.3"

# Testing
tempfile = "3.10"

# TypeScript type generation
ts-rs = "10"



[profile.dev]
opt-level = 0
debug = true

# Optimize image processing even in debug builds — pixel loops are
# 10-50x slower without optimizations, making map extraction unusable.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
