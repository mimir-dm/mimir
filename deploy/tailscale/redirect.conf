# Sends plain HTTP on the tailnet name to the same URL on HTTPS.
#
# `tailscale serve` does not forward X-Forwarded-Proto, so mimir-server
# cannot tell :80 from :443. The port is the only signal: :80 lands here.
server {
    listen 8081;
    server_name _;
    return 301 https://$host$request_uri;
}
