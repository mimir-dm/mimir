# The one Rust version of the workspace (MIMIR-T-0748): local builds, CI, the
# release and the Docker image use it. To bump: change it here and in the
# workflows and the Dockerfile (the test `the_rust_pins_agree` checks them),
# then fix what the new clippy reports in the same PR.
[toolchain]
channel = "1.95.0"
components = ["rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown"]
